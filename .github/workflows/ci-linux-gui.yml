name: build-linux-gui

on:
  workflow_dispatch:
  push:
    branches:
      - feat/linux-window-controller

permissions:
  contents: read

jobs:
  build:
    name: Build MaaCore + bundle GUI (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Fetch submodules
        shell: bash
        run: bash ./.github/scripts/sync-optional-submodules.sh --init --depth 1 src/MaaUtils 3rdparty/EmulatorExtras src/maa-cli

      - name: Cache MaaDeps
        id: cache-maadeps
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: ./src/MaaUtils/MaaDeps
          key: ${{ runner.os }}-x64-maadeps-${{ hashFiles('tools/maadeps-download.py') }}

      - name: Bootstrap MaaDeps
        if: steps.cache-maadeps.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/maadeps-download.py x64-linux

      - name: Install X11 dev headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Configure, build and install
        run: |
          cmake --preset linux-publish-x64 -DMAA_HASH_VERSION='${{ github.sha }}'
          cmake --build --preset linux-publish-x64 --parallel $(nproc)
          cmake --install build --prefix "$GITHUB_WORKSPACE/install" --config RelWithDebInfo
        env:
          CLICOLOR_FORCE: 1

      - name: Build maa-cli (window-preset fork)
        # upstream maa-cli does not ship the Window connection preset yet; the
        # bundle must use the fork branch that adds it (poland4000/maa-cli@feat/window-preset)
        run: |
          git clone --depth 1 --branch feat/window-preset https://github.com/poland4000/maa-cli.git maa-cli-src
          cd maa-cli-src
          cargo build --release --locked --package maa-cli --features git2/vendored-openssl
          cp target/release/maa "$GITHUB_WORKSPACE/maa"

      - name: Assemble self-contained bundle
        shell: bash
        run: |
          set -euxo pipefail
          root="$GITHUB_WORKSPACE"
          dist="$root/dist/maa-linux"
          mkdir -p "$dist/lib" "$dist/MaaResource" "$dist/gui"

          # maa-cli's data-dir contract: $DATA/{lib/*.so, MaaResource/resource,...}
          find install -name '*.so*' -exec cp -t "$dist/lib/" {} +
          cp -r install/resource "$dist/MaaResource/"
          # sibling resource dir so maa-cli's find_resource() succeeds without
          # the benign "Resource directory not found" warning
          ln -s MaaResource/resource "$dist/resource"

          # maa-cli CLI binary (built from the window-preset fork above)
          cp "$root/maa" "$dist/maa"

          # GUI (both variants) + the bundle launcher
          cp -r tools/maa-gui/maagui tools/maa-gui/maagui2 "$dist/gui/"
          cp tools/maa-gui/run.sh tools/maa-gui/run-maagui2.sh "$dist/gui/"
          cp tools/maa-gui/launcher.sh "$dist/"
          cp tools/maa-gui/toggle-pc-pack.sh "$dist/"
          cp tools/maa-gui/README.md "$dist/README.md"
          chmod +x "$dist/launcher.sh" "$dist/toggle-pc-pack.sh" "$dist/maa" \
                  "$dist/gui/run.sh" "$dist/gui/run-maagui2.sh"

      - name: Upload bundle
        # upload the bundle directory, not a pre-zipped file: GitHub wraps
        # artifact contents in a zip on download, so shipping a zip caused a
        # "zip in a zip" — one download now unzips straight into maa-linux/
        uses: actions/upload-artifact@v7
        with:
          name: maa-linux-gui
          path: dist/maa-linux
          if-no-files-found: error